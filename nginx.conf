worker_processes auto;

# Run as non-root; the Dockerfile sets USER nginx.
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # The stock nginx mime.types already maps `wasm` → `application/wasm`.
  # We only add what is missing.
  types {
    text/javascript mjs;
  }

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30;

  # gzip static text assets. woff2 and images are already compressed.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/wasm
    image/svg+xml;

  # Server does not need to advertise its version.
  server_tokens off;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers. Kept at server scope with no `add_header` inside any
    # location block so nginx does not drop them via its inheritance rule.
    # Cache control is set with the `expires` directive instead of add_header.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-src 'self' blob:; base-uri 'self'; form-action 'none';" always;

    # Long-cache the fingerprinted assets. Vite writes hashes into filenames.
    location /assets/ {
      expires 1y;
      access_log off;
      try_files $uri =404;
    }

    location = /index.html {
      expires -1;
    }

    # SPA fallback: any unknown route serves index.html so the app can boot.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
