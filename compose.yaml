services:
  blacklayer:
    build:
      context: .
      dockerfile: Dockerfile
    image: blacklayer:local
    container_name: blacklayer
    restart: unless-stopped
    ports:
      - "8080:8080"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

# Notes on hardening (deliberately kept off by default so the container just works):
#   read_only: true
#   tmpfs:
#     - /var/cache/nginx:uid=101,gid=101
#     - /var/log/nginx:uid=101,gid=101
#     - /var/run:uid=101,gid=101
#   cap_drop: [ALL]
#   cap_add:  [NET_BIND_SERVICE]
# Enable those if you are comfortable pinning to alpine nginx UID/GID 101 and
# accept the maintenance surface if the base image changes.
